[project]
name = "meteo-service"
version = "0.1.0"
description = "Умная аналитика метеоданных Центрально-Лесного заповедника (кейс 02, Заповедный хакатон)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "plotly>=5.24",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meteo"]
